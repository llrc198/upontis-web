<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensaje enviado · UPontis</title>
<link rel="icon" type="image/png" href="assets/img/logo.png">
<style>
  :root{--bg:#0A0C10;--bg2:#111520;--bone:#F2EEE6;--bone-dim:#B9B2A6;--accent:#E05533;--line2:rgba(255,255,255,.08)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--bone);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(circle at 15% 20%,rgba(224,85,51,.08),transparent 55%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.04),transparent 55%)}
  .card{max-width:520px;text-align:center;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:48px 36px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
  .check{width:72px;height:72px;border-radius:50%;background:rgba(60,190,120,.15);border:2px solid #3CBE78;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:34px;color:#3CBE78}
  h1{font-size:26px;margin-bottom:12px}
  p{color:var(--bone-dim);line-height:1.6;margin-bottom:28px}
  a.btn{display:inline-block;background:var(--accent);color:#0A0C10;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:999px;font-size:14px;letter-spacing:.4px}
  a.btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Mensaje enviado.</h1>
    <p>Gracias por escribirnos. Te respondemos en 24–48 h hábiles.</p>
    <a class="btn" href="/">VOLVER AL INICIO</a>
  </div>
</body>
</html>
